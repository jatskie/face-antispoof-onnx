name: Arm64 ONNX benchmark

on:
  workflow_dispatch:
    inputs:
      sample-count:
        description: Number of deterministic synthetic inputs
        required: true
        default: 32
        type: number
      minimum-size-reduction:
        description: Required INT8 model size reduction (%)
        required: true
        default: 60
        type: number
      minimum-throughput-speedup:
        description: Optional required INT8 throughput speedup
        required: true
        default: 0
        type: number
      minimum-p50-speedup:
        description: Optional required INT8 p50 latency speedup
        required: true
        default: 0
        type: number
      minimum-p95-speedup:
        description: Optional required INT8 p95 latency speedup
        required: true
        default: 0
        type: number

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate deterministic synthetic inputs
        env:
          SAMPLE_COUNT: ${{ inputs.sample-count }}
        run: |
          python -m pip install --disable-pip-version-check numpy
          python - <<'PY'
          import os

          import numpy as np

          sample_count = int(os.environ["SAMPLE_COUNT"])
          if not 1 <= sample_count <= 256:
              raise SystemExit("sample-count must be between 1 and 256")
          inputs = np.random.default_rng(20260825).random(
              (sample_count, 3, 128, 128), dtype=np.float32
          )
          np.savez("armbench-inputs.npz", input=inputs)
          PY

      - name: Compare FP32 and INT8 models
        id: armbench
        # Third-party action (single-maintainer, created 2026-08). Code at this SHA reviewed
        # 2026-10-30: local ONNX timing only, no network or secret access. Re-review before bumping.
        uses: ILoveBuns/armbench-action@24b0637ba3983b06cfc170b725607c91eb75ec3d
        with:
          baseline-model: models/best/98.20/best_model.onnx
          candidate-model: models/best/98.20/best_model_quantized.onnx
          dataset: armbench-inputs.npz
          allowed-architecture: aarch64
          minimum-size-reduction: ${{ inputs.minimum-size-reduction }}
          minimum-throughput-speedup: ${{ inputs.minimum-throughput-speedup }}
          minimum-p50-speedup: ${{ inputs.minimum-p50-speedup }}
          minimum-p95-speedup: ${{ inputs.minimum-p95-speedup }}

      - uses: actions/upload-artifact@v6
        if: ${{ always() && hashFiles('armbench-report.json', 'armbench-summary.md') != '' }}
        with:
          name: arm64-onnx-benchmark
          path: |
            armbench-report.json
            armbench-summary.md
          if-no-files-found: error
          retention-days: 14
